<!DOCTYPE html>
<html>
  <head>
    <title>Translation API Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .container {
        max-width: 600px;
      }
      .input-group {
        margin: 10px 0;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
      textarea,
      select,
      button {
        margin: 5px 0;
      }
      textarea {
        width: 100%;
      }
      .error {
        color: red;
      }
      .success {
        color: green;
      }
      .info {
        color: blue;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Translation API Test</h1>

      <div class="input-group">
        <label>Text to translate:</label>
        <textarea id="sourceText" rows="3">Hello world</textarea>
      </div>

      <div class="input-group">
        <label>From:</label>
        <select id="sourceLang">
          <option value="auto">Auto-detect</option>
          <option value="en" selected>English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
        </select>

        <label>To:</label>
        <select id="targetLang">
          <option value="es" selected>Spanish</option>
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="de">German</option>
        </select>
      </div>

      <div class="input-group">
        <label>Engine:</label>
        <select id="engine">
          <option value="google" selected>Google Translate</option>
          <option value="microsoft">Microsoft Translator</option>
        </select>
      </div>

      <button onclick="translateText()">Translate</button>
      <button onclick="detectLanguage()">Detect Language</button>
      <button onclick="testAllEndpoints()">Test All Endpoints</button>

      <div class="input-group">
        <label>Result:</label>
        <textarea id="result" rows="3" readonly></textarea>
      </div>

      <div id="log"></div>
    </div>

    <script>
      const API_BASE = "https://translation-server-phi.vercel.app/api";

      function log(message, type = "info") {
        const logDiv = document.getElementById("log");
        const p = document.createElement("p");
        p.className = type;
        p.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
        logDiv.appendChild(p);
        console.log(message);
      }

      async function makeRequest(endpoint, options = {}) {
        try {
          log(`Making request to ${endpoint}...`);
          const response = await fetch(`${API_BASE}${endpoint}`, {
            mode: "cors",
            ...options,
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();
          log(`✅ Success: ${endpoint}`, "success");
          return data;
        } catch (error) {
          log(`❌ Error on ${endpoint}: ${error.message}`, "error");
          throw error;
        }
      }

      async function translateText() {
        const text = document.getElementById("sourceText").value;
        const source = document.getElementById("sourceLang").value;
        const target = document.getElementById("targetLang").value;
        const engine = document.getElementById("engine").value;

        try {
          const result = await makeRequest("/translate", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              q: text,
              source: source,
              target: target,
              engine: engine,
            }),
          });

          document.getElementById("result").value = result.translatedText;
        } catch (error) {
          document.getElementById("result").value = `Error: ${error.message}`;
        }
      }

      async function detectLanguage() {
        const text = document.getElementById("sourceText").value;

        try {
          const result = await makeRequest("/detect", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ q: text }),
          });

          document.getElementById(
            "result"
          ).value = `Detected: ${result.language} (confidence: ${result.confidence})`;
        } catch (error) {
          document.getElementById("result").value = `Error: ${error.message}`;
        }
      }

      async function testAllEndpoints() {
        log("🧪 Starting comprehensive API test...");

        // Test languages endpoint
        try {
          const languages = await makeRequest("/languages");
          log(
            `Languages: Found ${languages.length} supported languages`,
            "success"
          );
        } catch (error) {
          log(`Languages endpoint failed: ${error.message}`, "error");
        }

        // Test detection endpoint
        try {
          const detection = await makeRequest("/detect", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ q: "Bonjour le monde" }),
          });
          log(`Detection: ${detection.language}`, "success");
        } catch (error) {
          log(`Detection endpoint failed: ${error.message}`, "error");
        }

        // Test translation endpoint
        try {
          const translation = await makeRequest("/translate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ q: "Hello", source: "en", target: "es" }),
          });
          log(`Translation: "${translation.translatedText}"`, "success");
        } catch (error) {
          log(`Translation endpoint failed: ${error.message}`, "error");
        }

        log("🏁 Test complete!");
      }

      // Test on page load
      window.onload = function () {
        log("Page loaded, testing endpoints...");
        testAllEndpoints();
      };
    </script>
  </body>
</html>
